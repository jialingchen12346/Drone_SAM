known_negative_results:
  - name: "Dual-Branch Co-Training"
    conclusion: "去融合叙事更干净，但性能不足。"
  - name: "Point Diffusion"
    conclusion: "self/consensus/feature-gated 版本均未稳定提升 test。"
  - name: "Class-balanced Sampler"
    conclusion: "r20 test 下降，破坏整体分布。"
  - name: "MFNet external unlabeled"
    conclusion: "域差异导致 test 下降。"
  - name: "Thermal Prior Injection"
    result: "r10 test 60.53"
    conclusion: "与主线 60.59 打平，无明确增益。"
  - name: "Disagreement Refinement no-gate"
    result: "r10 val 65.58 / test 58.54"
    conclusion: "去掉空间 gate 后 test 明显下降，反向证明 disagreement gate 是核心机制。"
  - name: "SAM2 point proxy region supervision"
    result: "r10 val 67.70 / test 58.48"
    conclusion: "val 显著升高但 test 下降，放大 val-test gap，暂不并入主线。"
  - name: "SAM2 point proxy low-weight retry"
    result: "w=0.1 val 66.98 / test 59.70; w=0.1+agreement gate val 66.31 / test 59.08"
    conclusion: "降权可缓解但仍低于主线；agreement gate 无收益，proxy 线暂不继续作为 P0。"
  - name: "Naive Fusion baseline"
    result: "r10 val 64.10 / test 55.79"
    conclusion: "低于主线 60.59，证明不是任意 RGB-T 融合都能得到收益。"
  - name: "Layer-decay LR schedule (r10 e80)"
    config: "r10/e80/seed42/bs=2+2/crop512/modality_heads/dref_prob_w0.5/soft_agreement/lr_adapter=1e-4/lr_rgb_backbone=2e-5/rgb_layer_decay=0.9/lr_aux=1e-4/lr_head=2e-4"
    result: "best val strict 61.75 / test strict 56.68"
    conclusion: "相比主线 60.59 明显退化。小类严重下滑（Truck 3.9, Bus 31.0, Bicycle 0.0）。RGB 主干按层衰减 + 长训 e80 不适合当前协议，暂不继续。"

