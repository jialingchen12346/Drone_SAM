research_position:
  title_zh: "面向标注高效 RGB-T 语义分割的跨模态可靠性估计与分歧细化"
  title_en_candidate: "Cross-Modal Reliability and Disagreement Refinement for Label-Efficient RGB-T Semantic Segmentation"
  core_claim:
    - "RGB/Thermal 独立预测提供跨模态可靠性信号。"
    - "Teacher 伪标签由置信度准入，并由跨模态一致性软加权。"
    - "跨模态分歧图用于预测层残差纠错。"
    - "弱点提示是低成本、高可信锚点。"
  non_claims:
    - "不声称提出全监督 SOTA 融合器。"
    - "不声称解决跨模态空间配准。"
    - "不把 point diffusion 作为当前主线贡献。"

protocol:
  dataset: "FMB"
  main_metric: "test strict mIoU, absent-score=0.0"
  label_budget: "r10"
  dense_labels: "10% train samples"
  unlabeled_pool: "remaining 90% train samples"
  point_prompt:
    budget: "100% train samples"
    rule: "每张训练图中，每个出现类别随机采 1 个 mask 内点；类别像素数 < 8 跳过。"
  loss_weights:
    unsup_weight: 1.0
    point_weight: 0.2
  pseudo_label:
    confidence_threshold: 0.80
    agreement_mode: "argmax"
    agreement_policy: "soft_weight"
    agreement_floor: 0.5
  ema_teacher:
    pseudo_label_source: "teacher"
    default_val_model: "student"
    new_options:
      - "train_label_efficient.py --val-model teacher"
      - "eval_label_eff.py --checkpoint-state teacher"

